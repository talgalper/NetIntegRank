name: netintegrank-hhnet
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.5
  - numpy=1.14
  - scipy=0.19
  - h5py=2.7
  - networkx=1.11
  - matplotlib=2.1
  - pip
  - parallel
  - gfortran
  - numpy-base=1.14
  - libcxx<23 #libcxx (the Mac's C++ library) builds from 13 Nov 2026 on drop a symbol matplotlib 2.1 needs
  - zlib=1.2.13
  - pip:
      - argparse==1.4.0